
name: NexaCart CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build and Validate NexaCart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate backend JavaScript syntax
        run: |
          node --check api-gateway/index.js
          node --check user-service/index.js
          node --check product-service/index.js
          node --check cart-service/index.js
          node --check order-service/index.js
          node --check notification-service/index.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Validate Docker Images
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Gateway
        run: docker build -t nexacart-api-gateway:ci ./api-gateway

      - name: Build User Service
        run: docker build -t nexacart-user-service:ci ./user-service

      - name: Build Product Service
        run: docker build -t nexacart-product-service:ci ./product-service

      - name: Build Cart Service
        run: docker build -t nexacart-cart-service:ci ./cart-service

      - name: Build Order Service
        run: docker build -t nexacart-order-service:ci ./order-service

      - name: Build Notification Service
        run: docker build -t nexacart-notification-service:ci ./notification-service

  docker-publish:
    name: Publish Images to Docker Hub
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: |
            pankaj16sep/nexacart-api-gateway:latest
            pankaj16sep/nexacart-api-gateway:${{ github.sha }}

      - name: Build and Push User Service
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          push: true
          tags: |
            pankaj16sep/nexacart-user-service:latest
            pankaj16sep/nexacart-user-service:${{ github.sha }}

      - name: Build and Push Product Service
        uses: docker/build-push-action@v6
        with:
          context: ./product-service
          push: true
          tags: |
            pankaj16sep/nexacart-product-service:latest
            pankaj16sep/nexacart-product-service:${{ github.sha }}

      - name: Build and Push Cart Service
        uses: docker/build-push-action@v6
        with:
          context: ./cart-service
          push: true
          tags: |
            pankaj16sep/nexacart-cart-service:latest
            pankaj16sep/nexacart-cart-service:${{ github.sha }}

      - name: Build and Push Order Service
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          push: true
          tags: |
            pankaj16sep/nexacart-order-service:latest
            pankaj16sep/nexacart-order-service:${{ github.sha }}

      - name: Build and Push Notification Service
        uses: docker/build-push-action@v6
        with:
          context: ./notification-service
          push: true
          tags: |
            pankaj16sep/nexacart-notification-service:latest
            pankaj16sep/nexacart-notification-service:${{ github.sha }}
