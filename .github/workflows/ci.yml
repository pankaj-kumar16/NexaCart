
name: NexaCart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build and Validate NexaCart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate backend JavaScript syntax
        run: |
          node --check api-gateway/index.js
          node --check user-service/index.js
          node --check product-service/index.js
          node --check cart-service/index.js
          node --check order-service/index.js
          node --check notification-service/index.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Gateway image
        run: docker build -t nexacart-api-gateway:ci ./api-gateway

      - name: Build User Service image
        run: docker build -t nexacart-user-service:ci ./user-service

      - name: Build Product Service image
        run: docker build -t nexacart-product-service:ci ./product-service

      - name: Build Cart Service image
        run: docker build -t nexacart-cart-service:ci ./cart-service

      - name: Build Order Service image
        run: docker build -t nexacart-order-service:ci ./order-service

      - name: Build Notification Service image
        run: docker build -t nexacart-notification-service:ci ./notification-service
