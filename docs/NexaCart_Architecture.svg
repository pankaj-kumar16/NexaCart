<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<defs>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#f8fafc}
    .subtitle{font:16px Arial,sans-serif;fill:#cbd5e1}
    .label{font:700 21px Arial,sans-serif;fill:#f8fafc}
    .small{font:15px Arial,sans-serif;fill:#dbeafe}
    .tiny{font:14px Arial,sans-serif;fill:#cbd5e1}
    .box{stroke-width:2;rx:18}
    .edge{stroke:#93a4bd;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .edgeDash{stroke:#a78bfa;stroke-width:2.3;fill:none;stroke-dasharray:8 7;marker-end:url(#arrowPurple)}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93a4bd"/></marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/></marker>
</defs>
<rect width="1440" height="1000" fill="#0b1220"/>
<text x="720" y="58" text-anchor="middle" class="title">NexaCart — Microservices Architecture</text>
<text x="720" y="90" text-anchor="middle" class="subtitle">React storefront · Express API Gateway · Domain services · External integrations</text>

<!-- Client -->
<rect x="430" y="125" width="580" height="105" class="box" fill="#1e3a5f" stroke="#60a5fa"/>
<text x="720" y="166" text-anchor="middle" class="label">Customer / Browser</text>
<text x="720" y="196" text-anchor="middle" class="small">React + Vite Frontend · Catalog · Cart · Checkout · Orders · Profile</text>

<!-- Gateway -->
<path d="M720 230 V280" class="edge"/>
<rect x="430" y="280" width="580" height="105" class="box" fill="#115e72" stroke="#22d3ee"/>
<text x="720" y="321" text-anchor="middle" class="label">API Gateway — Express</text>
<text x="720" y="351" text-anchor="middle" class="small">Single API entry point · Request routing · Swagger docs</text>

<!-- Services -->
<path d="M720 385 V430" class="edge"/>
<rect x="80" y="430" width="390" height="120" class="box" fill="#1f513c" stroke="#34d399"/>
<text x="275" y="474" text-anchor="middle" class="label">User Service</text>
<text x="275" y="505" text-anchor="middle" class="small">Registration · Login · Profile · Password</text>

<rect x="525" y="430" width="390" height="120" class="box" fill="#1f513c" stroke="#34d399"/>
<text x="720" y="474" text-anchor="middle" class="label">Product Service</text>
<text x="720" y="505" text-anchor="middle" class="small">Catalog · Product data · Stock operations</text>

<rect x="970" y="430" width="390" height="120" class="box" fill="#1f513c" stroke="#34d399"/>
<text x="1165" y="474" text-anchor="middle" class="label">Cart Service</text>
<text x="1165" y="505" text-anchor="middle" class="small">User cart · Cart items · Cart updates</text>

<!-- Gateway route arrows -->
<path d="M510 385 V405 H275 V430" class="edge"/>
<path d="M720 385 V430" class="edge"/>
<path d="M930 385 V405 H1165 V430" class="edge"/>

<!-- Order and Notification -->
<rect x="430" y="625" width="580" height="125" class="box" fill="#5b3b83" stroke="#c4b5fd"/>
<text x="720" y="672" text-anchor="middle" class="label">Order Service</text>
<text x="720" y="705" text-anchor="middle" class="small">Checkout · Order lifecycle · Cancellation · Payment coordination</text>
<path d="M720 550 V625" class="edge"/>

<rect x="80" y="820" width="390" height="100" class="box" fill="#36465d" stroke="#94a3b8"/>
<text x="275" y="860" text-anchor="middle" class="label">Notification Service</text>
<text x="275" y="890" text-anchor="middle" class="small">Order email notifications</text>

<rect x="525" y="820" width="390" height="100" class="box" fill="#374151" stroke="#9ca3af"/>
<text x="720" y="860" text-anchor="middle" class="label">MongoDB</text>
<text x="720" y="890" text-anchor="middle" class="small">Persistent application data</text>

<rect x="970" y="820" width="390" height="100" class="box" fill="#713b32" stroke="#fb923c"/>
<text x="1165" y="860" text-anchor="middle" class="label">Razorpay</text>
<text x="1165" y="890" text-anchor="middle" class="small">Test payment integration</text>

<!-- Internal service calls from Order -->
<path d="M520 625 C450 600 350 585 275 550" class="edgeDash"/>
<path d="M720 625 V580 V550" class="edgeDash"/>
<path d="M920 625 C1010 600 1110 585 1165 550" class="edgeDash"/>
<path d="M575 750 C500 780 400 800 275 820" class="edge"/>
<path d="M720 750 V820" class="edge"/>
<path d="M865 750 C950 780 1060 800 1165 820" class="edge"/>

<!-- Key -->
<rect x="80" y="950" width="20" height="4" fill="#93a4bd"/>
<text x="110" y="958" class="tiny">Solid: routing / persistence / integration</text>
<rect x="425" y="950" width="20" height="4" fill="#a78bfa"/>
<text x="455" y="958" class="tiny">Dashed purple: Order Service internal coordination</text>
</svg>
